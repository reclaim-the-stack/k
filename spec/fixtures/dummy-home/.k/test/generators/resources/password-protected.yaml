# A resource with generated credentials, sealed by k generate.
#
# Example values.yaml:
# env:
#   - { name: SERVICE_URL, valueFrom: { secretKeyRef: { name: %{application}%{suffix}-auth, key: url } } }

{{- $name := print .Chart.Name "%{suffix}" }}
---
# The plain Secret below is replaced with a SealedSecret when generated
apiVersion: v1
kind: "Secret"
metadata:
  name: %{application}%{suffix}-auth
  namespace: default
stringData:
  password: %{randomPassword}
  url: service://app:%{randomPassword}@%{application}%{suffix}-service:1234
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
spec:
  ports:
    - port: 1234
